name: 同步博客最新文章

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://hexo.qnrs.cloudns.org/atom.xml"
          max_post_count: "5"
          comment_tag_name: "BLOG-POSTS"
